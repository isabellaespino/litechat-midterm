<div class="sidebar-inner" data-sidebar-list>
  <a class="btn new-chat" href="{% url 'chat_new' %}">+ New chat</a>
  <ul class="chat-links" aria-label="Your chats">
    {% for c in sidebar_conversations %}
      <li><a href="{% url 'chat_detail' c.pk %}"{% if conversation and c.pk == conversation.pk %} aria-current="page"{% endif %}>{{ c.title }}</a></li>
    {% empty %}
      <li class="muted">No chats yet</li>
    {% endfor %}
  </ul>
</div>
