<div class="sidebar-inner" data-sidebar-list>
  <a class="btn new-chat" href="{% url 'chat_new' %}">+ New chat</a>
  <ul class="chat-links" aria-label="Your chats">
    {% for c in sidebar_conversations %}
      <li class="chat-row">
        <a class="chat-link" href="{% url 'chat_detail' c.pk %}"{% if conversation and c.pk == conversation.pk %} aria-current="page"{% endif %}><span class="chat-title">{{ c.title }}</span><time class="chat-date" datetime="{{ c.updated_at|date:'c' }}" data-relative title="{{ c.updated_at|date:'M j, Y H:i' }} UTC">{{ c.updated_at|date:'M j, Y' }}</time></a>
        <a class="chat-delete" href="{% url 'chat_delete' c.pk %}" aria-label="Delete “{{ c.title }}”" title="Delete chat">×</a>
      </li>
    {% empty %}
      <li class="muted">No chats yet</li>
    {% endfor %}
  </ul>
</div>
