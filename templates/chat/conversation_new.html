{% extends "base.html" %}
{% block title %}New chat{% endblock %}
{% block content %}
  <h1>New chat</h1>
  {% include "chat/_out_of_credit.html" %}
  <form method="post" class="card">
    {% csrf_token %}
    {{ form.as_p }}
    <button type="submit" class="btn">Send</button>
    <span class="muted">Replies can take a few seconds.</span>
  </form>
  <p class="muted">You pay only for the tokens each reply uses. <a href="{% url 'model_list' %}">Compare models</a> · <a href="{% url 'chat_list' %}">Back to chats</a></p>
{% endblock %}
